# Master data specification — v0.3 (ChatGPT reviews applied: B1-B5, C3 feasibility)
# Everything here is synthetic. No external datasets, names or real organisations.
# Counts marked "scales" derive from scale.employees; the rest are fixed.
#
# Generation contracts (binding on the generator; each has a validator check):
#  C1 Totals are exact: employees = scale.employees; initial = round(employees * initial_share);
#     in-window hires = employees - initial. Hire mix (backfill/growth) is a TARGET: backfills are
#     drawn only from real earlier exits with the configured delay; any unmet backfill quota becomes
#     growth hires. Realised shares are reported. Exits are never invented or moved to fill quotas.
#  C2 All integer allocations (teams per family, headcount per family, levels) use largest-remainder
#     allocation with ties broken by the fixed order of the lists below. Team count is computed as
#     round(initial / team_size_target) and is the single source of truth; count_full_scale is a
#     cross-check only. Managers (1 per team) are allocated inside each family's headcount.
#  C3 Feasible pre-window careers (amended after ChatGPT review): the 2025-01-01 role (level) and
#     tenure are sampled first. The number of pre-window promotions is
#        k = min(level_gap_available, floor(tenure_years / promotion_interval.min_years)),
#     drawn from a seeded distribution within that cap, and the person was hired k levels below the
#     current role (external hires may therefore join at any level, including as a manager). For
#     managers, the last promotion (if any) is the IC-to-manager step. Promotion dates are spaced at
#     >= min_years and fall between hire_date and 2024-12-31. k = 0 means "never promoted" and
#     months_since_promotion stays NULL. Nothing is clamped: if no promotion fits, k = 0.
#     Team history: each team's created_date = min(configured draw, earliest member assignment start).
#  C4 Survey shares: response_rate includes partial responses; partial_rate is conditional on
#     responding. => 76% complete, 4% partial, 20% no response.
#  C5 Leave accounting:
#     - EL: one accrual per calendar month with any employment, posted on the 1st (or on the hire
#       date in the hire month). No accrual after the exit month.
#     - SL: one grant of 3 per year, on Jan 1, or on the hire date for in-year joiners (a Jan 1
#       joiner gets exactly one grant).
#     - Taken leave is recorded as one row per calendar month a leave block touches (txn_date = first
#       leave workday in that month), and only on scheduled workdays while employed.
#     - Dec 31 close: one lapse row per type with a positive remaining balance; no zero-day rows.
#       Exited employees' remaining balance also lapses at the Dec 31 close of the exit year. This
#       accounting entry is the only row allowed after termination.

version: 0.3
seed: 20261022

scale:
  employees: 10000            # total employee histories (starter run: 500)
  initial_share: 0.90         # employed on 2025-01-01; the rest are hired during the window
  team_size_target: 15        # incl. the manager; a distribution target, not a hard limit

window:
  start: 2025-01-01
  end: 2026-12-31             # observation_end
  scoring_dates: [2025-03-31, 2025-06-30, 2025-09-30, 2025-12-31, 2026-03-31, 2026-06-30, 2026-09-30, 2026-12-31]

compensation_bands:           # fixed: 6 (SYN = synthetic units / year); never used as predictors
  - {band_id: BAND-01, level: 1, min: 30000,  mid: 36000,  max: 42000}
  - {band_id: BAND-02, level: 2, min: 40000,  mid: 48000,  max: 56000}
  - {band_id: BAND-03, level: 3, min: 54000,  mid: 65000,  max: 76000}
  - {band_id: BAND-04, level: 4, min: 72000,  mid: 86000,  max: 100000}
  - {band_id: BAND-05, level: 5, min: 95000,  mid: 114000, max: 133000}
  - {band_id: BAND-06, level: 6, min: 125000, mid: 150000, max: 175000}

job_families:                 # share of headcount; teams are allocated in the same proportions (scales)
  engineering:   0.30
  operations:    0.15
  support:       0.15
  sales:         0.13
  data:          0.08
  product:       0.07
  finance_admin: 0.07
  design:        0.05

roles:                        # fixed: 8 families x (5 IC levels + 3 manager levels) = 64 roles
  ic_levels: [1, 2, 3, 4, 5]
  manager_levels: [4, 5, 6]
  title_pattern: "{Family} {IC|Manager} L{level}"   # e.g. "Engineering IC L3", "Sales Manager L4"

ic_level_mix:                 # individual contributors only (managers are 1 per team)
  1: 0.25
  2: 0.30
  3: 0.25
  4: 0.14
  5: 0.06

manager_level_mix:            # level of each team's people manager
  4: 0.70
  5: 0.25
  6: 0.05

teams:
  count_full_scale: 600       # cross-check only; count = round(initial employees / team_size_target) (C2)
  name_pattern: "{Family} {NNN}"     # e.g. "Engineering 014"
  created_date_range: [2012-01-01, 2024-06-30]
  managers_per_team: 1        # exactly one manager assignment at a time, or a recorded vacancy
  vacancy_policy: "manager exit -> vacancy; cases route to HR; filled by an internal promotion or an external hire within 1-3 months"

tenure_at_window_start:       # hire dates for the initial population
  distribution: gamma
  mean_years: 4.0
  shape: 1.6
  min_months: 1
  max_years: 18

in_window_hires:             # exact count = employees - initial (C1)
  target_share_backfill: 0.7  # TARGET: replacements for real earlier exits, 1-3 months after the exit
  target_share_growth: 0.3    # spread evenly across the 24 months; absorbs any unmet backfill quota
  backfill_delay_months: [1, 3]

pre_window_career:            # C3 (feasibility-capped; external hires may enter above L1)
  promotion_interval_years: {mean: 3.0, min_years: 1.5}
  promotion_count_prob:       # P(k) before applying the feasibility cap
    0: 0.35
    1: 0.35
    2: 0.20
    3: 0.10

notice_days_by_level: {1: 30, 2: 30, 3: 60, 4: 60, 5: 90, 6: 90}   # synthetic policy, not a legal claim

calendar:
  workdays: [Mon, Tue, Wed, Thu, Fri]
  hours_per_day: 8
  company_holidays_per_year:  # fixed synthetic list (same month-day each year)
    ["01-01", "01-26", "03-14", "05-01", "08-15", "10-02", "10-20", "11-08", "12-25", "12-31"]

leave_policy:                 # confirmed by Siddarth
  earned_leave: {accrual_per_employed_month: 1}
  sick_leave: {grant_days: 3, granted_on: "Jan 1, or hire date for in-year joiners"}
  year_end: "all unused EL and SL lapse on Dec 31; nothing carries over"
  sick_leave_restricted: true   # never a feature, hazard input or manager-visible value

engagement_survey:
  waves_per_year: 4
  sent_on: "15th of the last month of each quarter"
  scale: [1, 5]
  items: 5
  response_rate: 0.80         # includes partial responses (C4)
  partial_rate: 0.05          # conditional on responding => 76% complete / 4% partial / 20% none
  index_min_items: 3

demo_users:                   # seeded app logins (passwords generated at seed time, never committed)
  hr_partner: 2
  manager: 6                  # mapped to managers of teams with suggested check-ins
  it_ops: 1
  admin: 1
